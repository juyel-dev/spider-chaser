name: Screenshots

# Takes the README / Chrome Web Store screenshots with the real extension code in headless Chrome
# and commits them to docs/screenshots/.
# Run it by hand: GitHub -> Actions -> Screenshots -> Run workflow  (also runs when a release is published)
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install tools
        working-directory: test
        run: npm install --no-audit --no-fund

      - name: Take screenshots
        working-directory: test
        run: node shoot.js

      - name: Keep a copy as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots/*.png

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Update screenshots [skip ci]"
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi
