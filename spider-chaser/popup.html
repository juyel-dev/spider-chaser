<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Spider Chaser</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>🕷️ Spider Chaser</h1>
    <label class="switch" title="Turn all spiders on or off">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </header>

  <div class="control">
    <div class="label"><label for="speed">Speed</label><output id="speedOut"></output></div>
    <input type="range" id="speed" min="0.5" max="2" step="0.1">
  </div>

  <div class="control">
    <div class="label"><label for="size">Size</label><output id="sizeOut"></output></div>
    <input type="range" id="size" min="0.6" max="2" step="0.1">
  </div>

  <div class="control">
    <div class="label"><label for="count">Spiders</label><output id="countOut"></output></div>
    <input type="range" id="count" min="1" max="6" step="1">
  </div>

  <div class="control row">
    <span>Web drops</span>
    <label class="switch" title="Spiders sometimes climb away and drop back down on a silk thread">
      <input type="checkbox" id="drops">
      <span class="slider"></span>
    </label>
  </div>

  <div class="control row">
    <span>Flies (prey)</span>
    <label class="switch" title="A fly shows up now and then; spiders ambush it when it lands">
      <input type="checkbox" id="flies">
      <span class="slider"></span>
    </label>
  </div>

  <div class="control row">
    <span>Webs</span>
    <label class="switch" title="Spiders sometimes weave a web in a screen corner">
      <input type="checkbox" id="webs">
      <span class="slider"></span>
    </label>
  </div>

  <div class="site">
    <div class="label"><span>This site</span><output id="siteName"></output></div>
    <button id="siteBtn" type="button"></button>
  </div>

  <div id="blockedBox" hidden>
    <div class="label"><span>Disabled sites</span></div>
    <ul id="blockedList"></ul>
  </div>

  <button id="reset" type="button">Reset to default</button>
  <p class="hint">Alt+S: hide on this tab &nbsp;·&nbsp; Alt+R: reset positions</p>

  <script src="popup.js"></script>
</body>
</html>
